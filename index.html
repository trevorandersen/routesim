<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RouteSim</title>
  <style>
    :root {
      color-scheme: dark;
      --theme: dark;
      --bg: #0f1419;
      --panel: #151c22;
      --panel-soft: #1e2730;
      --line: #2d3945;
      --line-strong: #607080;
      --text: #e6edf3;
      --muted: #95a4b3;
      --accent: #14746f;
      --accent-soft: #123d3a;
      --danger: #f87171;
      --stage-bg: #111920;
      --canvas-bg: #0d141b;
      --grid-major: rgba(214, 224, 235, 0.08);
      --grid-minor: rgba(214, 224, 235, 0.04);
      --topbar-bg: rgba(21, 28, 34, 0.94);
      --hint-text: #cfdae5;
      --hint-bg: rgba(21, 28, 34, 0.9);
      --rail-bg: #101820;
      --rail-button-active-text: #d7f1ed;
      --rail-button-active-bg: #0e5b57;
      --link-host: #ffffff;
      --link-switch: #7dd3fc;
      --link-router: #ef4444;
      --link-active: #facc15;
      --label-primary: #e6edf3;
      --label-ip: #c7d2de;
      --label-mac: #95a4b3;
      --pc-fill: #162235;
      --pc-stroke: #3b82c4;
      --pc-accent: #1d334d;
      --pc-icon: #8db7e8;
      --switch-fill: #122824;
      --switch-stroke: #1f8f86;
      --switch-accent: #173a35;
      --switch-icon: #7fd1c8;
      --router-fill: #2b2114;
      --router-stroke: #a56a26;
      --router-accent: #3a2a16;
      --router-icon: #d6a15e;
      --lan-fill: #1e2431;
      --lan-stroke: #6f8192;
      --lan-accent: #293242;
      --lan-icon: #b7c4d1;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.34);
      --inspector-width: 320px;
      --terminal-height: 280px;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --theme: light;
      --bg: #eef1f4;
      --panel: #ffffff;
      --panel-soft: #f7f9fb;
      --line: #cfd7df;
      --line-strong: #8b98a5;
      --text: #17212b;
      --muted: #667381;
      --accent-soft: #dff4f0;
      --danger: #bc3b3b;
      --stage-bg: #e8edf1;
      --canvas-bg: #eef3f6;
      --grid-major: rgba(38, 55, 70, 0.08);
      --grid-minor: rgba(38, 55, 70, 0.04);
      --topbar-bg: rgba(255, 255, 255, 0.92);
      --hint-text: #41505f;
      --hint-bg: rgba(255, 255, 255, 0.88);
      --rail-bg: #1d2935;
      --rail-button-active-text: #0e5b57;
      --rail-button-active-bg: #d7f1ed;
      --link-host: #3f4650;
      --link-switch: #2563eb;
      --link-router: #dc2626;
      --link-active: #0e827a;
      --label-primary: #17212b;
      --label-ip: #52616f;
      --label-mac: #667381;
      --pc-fill: #f8fbff;
      --pc-stroke: #3264a8;
      --pc-accent: #dbeafe;
      --pc-icon: #244c84;
      --switch-fill: #f8fff9;
      --switch-stroke: #14746f;
      --switch-accent: #dff4f0;
      --switch-icon: #0d5a56;
      --router-fill: #fffaf1;
      --router-stroke: #9a5b13;
      --router-accent: #fdecc8;
      --router-icon: #73420c;
      --lan-fill: #f7f9fb;
      --lan-stroke: #667381;
      --lan-accent: #e8eef3;
      --lan-icon: #41505f;
      --shadow: 0 10px 28px rgba(19, 33, 46, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) var(--inspector-width);
      grid-template-rows: 100vh;
    }

    body.inspector-closed {
      grid-template-columns: 72px minmax(0, 1fr);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      background: var(--rail-bg);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #263746;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .tool-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-button,
    .icon-button {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      border-radius: 8px;
      transition: background 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .tool-button {
      width: 48px;
      height: 48px;
      color: #d7e1ea;
      background: transparent;
    }

    .tool-button svg,
    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .tool-button:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .tool-button.active {
      color: var(--rail-button-active-text);
      background: var(--rail-button-active-bg);
    }

    .spacer {
      flex: 1;
    }

    .stage {
      min-width: 0;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      background: var(--stage-bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--line);
    }

    .title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1;
      letter-spacing: 0;
    }

    .mode-label {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zoom-readout {
      min-width: 54px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .icon-button:hover {
      color: var(--text);
      background: var(--panel);
      transform: translateY(-1px);
    }

    .icon-button[aria-expanded="true"] {
      color: var(--accent);
      border-color: rgba(20, 116, 111, 0.35);
      background: var(--accent-soft);
    }

    .icon-button.danger:hover {
      color: var(--danger);
      border-color: rgba(188, 59, 59, 0.36);
    }

    .topology-chooser {
      position: relative;
      display: inline-block;
    }
    .topology-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      min-width: 200px;
      z-index: 100;
      padding: 4px 0;
    }
    .topology-menu.open { display: block; }
    .topology-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 14px;
      font: 600 13px/1 Inter, system-ui, sans-serif;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 0;
    }
    .topology-option:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: var(--canvas-bg);
      background-image:
        linear-gradient(var(--grid-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
        linear-gradient(var(--grid-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
      cursor: crosshair;
    }

    .hint {
      position: absolute;
      left: 16px;
      bottom: 16px;
      max-width: min(560px, calc(100% - 32px));
      padding: 9px 12px;
      border: 1px solid rgba(139, 152, 165, 0.32);
      border-radius: 8px;
      color: var(--hint-text);
      background: var(--hint-bg);
      box-shadow: 0 6px 18px rgba(19, 33, 46, 0.08);
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .terminal-panel {
      position: fixed;
      left: 72px;
      right: 0;
      bottom: 0;
      z-index: 8;
      height: min(var(--terminal-height), calc(100vh - 80px));
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr) 44px;
      border-top: 1px solid var(--line);
      background: #0a0f14;
      box-shadow: 0 -18px 36px rgba(0, 0, 0, 0.28);
    }

    body:not(.inspector-closed) .terminal-panel {
      right: var(--inspector-width);
    }

    body.terminal-closed .terminal-panel {
      display: none;
    }

    .terminal-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px 0 16px;
      color: var(--text);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
    }

    .terminal-titlebar span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .terminal-output {
      min-height: 0;
      overflow: auto;
      padding: 12px 16px;
      color: #d6e3ef;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .terminal-line {
      margin: 0 0 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .terminal-line.command {
      color: #7dd3fc;
    }

    .terminal-line.error {
      color: #fca5a5;
    }

    .terminal-line.muted {
      color: #95a4b3;
    }

    .terminal-input-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px 12px 10px 16px;
      border-top: 1px solid rgba(214, 224, 235, 0.12);
      color: #7dd3fc;
      background: #0a0f14;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .terminal-input-row input {
      width: 100%;
      min-width: 0;
      height: 26px;
      border: 0;
      outline: 0;
      color: #e6edf3;
      background: transparent;
      font: inherit;
    }

    .terminal-input-row input::placeholder {
      color: #6f8192;
    }

    .inspector {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .inspector-resize {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 3;
      width: 8px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: col-resize;
    }

    .inspector-resize::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: transparent;
      transition: background 140ms ease;
    }

    .inspector-resize:hover::before,
    body.resizing-inspector .inspector-resize::before {
      background: var(--accent);
    }

    body.resizing-inspector {
      cursor: col-resize;
      user-select: none;
    }

    body.inspector-closed .inspector {
      display: none;
    }

    .panel-section {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-section h2 {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-heading h2 {
      margin: 0;
    }

    .panel-toggle {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel-soft);
      cursor: pointer;
    }

    .panel-toggle:hover,
    .panel-toggle[aria-expanded="true"] {
      color: var(--text);
      background: var(--panel);
    }

    .panel-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .option-list {
      display: grid;
      gap: 10px;
    }

    .option-list.closed {
      display: none;
    }

    .toggle-row {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 13px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-width: 0;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 10px;
      color: var(--text);
      background: var(--panel-soft);
      outline: none;
    }

    .field input::placeholder {
      color: var(--muted);
      opacity: 0.78;
    }

    .input-with-button {
      display: flex;
      gap: 6px;
    }

    .input-with-button input {
      flex: 1;
    }

    .inline-button {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .inline-button:hover {
      color: var(--text);
      border-color: var(--line-strong);
      background: var(--panel);
    }

    .field input[type="checkbox"] {
      width: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--accent);
      justify-self: start;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      color: #29404f;
      background: #e8eef3;
      font-size: 12px;
      font-weight: 700;
    }

    .port-list {
      display: grid;
      gap: 6px;
      margin: 2px 0 13px;
    }

    .interface-list {
      display: grid;
      gap: 8px;
      margin: 2px 0 13px;
    }

    .interface-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 46px minmax(70px, 0.8fr) minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      font-size: 12px;
    }

    .interface-name {
      color: var(--muted);
      font-weight: 800;
    }

    .interface-peer {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
    }

    .interface-row input {
      width: 100%;
      min-width: 0;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 9px;
      color: var(--text);
      background: var(--panel);
      outline: none;
    }

    .port-row {
      min-width: 0;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      font-size: 12px;
    }

    .port-id {
      color: var(--muted);
      font-weight: 800;
      flex: 0 0 38px;
    }

    .port-mode {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--panel);
      color: var(--muted);
    }
    .port-mode.trunk {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .port-vlan {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
    }

    .port-peer {
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
    }

    .port-peer.empty {
      color: var(--muted);
      font-weight: 600;
    }

    .data-table {
      width: 100%;
      margin: 2px 0 13px;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel-soft);
      font-size: 12px;
    }

    .data-table th,
    .data-table td {
      min-width: 0;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    .data-table th {
      color: var(--muted);
      font-weight: 800;
      background: var(--panel);
    }

    .data-table tr:last-child td {
      border-bottom: 0;
    }

    .data-table td {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
    }

    .table-empty {
      color: var(--muted);
      font-weight: 600;
    }

    .port-remove {
      appearance: none;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      line-height: 1;
    }

    .port-remove:hover {
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.42);
      background: var(--panel);
    }

    .port-remove svg {
      display: block;
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .empty-state {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .wide-button {
      width: 100%;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--panel-soft);
      cursor: pointer;
    }

    .wide-button:hover {
      border-color: var(--line-strong);
      background: var(--panel);
    }

    .wide-button.danger {
      color: var(--danger);
    }

    .wide-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .device-list {
      padding: 10px;
    }

    .device-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .device-row:hover,
    .device-row.active {
      border-color: var(--line);
      background: var(--panel-soft);
    }

    .device-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .device-type {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      body,
      body.inspector-closed {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .inspector {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        width: min(var(--inspector-width), calc(100vw - 72px));
        height: 100vh;
        box-shadow: var(--shadow);
      }

      body:not(.inspector-closed) .inspector {
        display: flex;
      }

      body.inspector-closed .inspector {
        display: none;
      }

      .terminal-panel,
      body:not(.inspector-closed) .terminal-panel {
        right: 0;
      }
    }

    @media (max-width: 820px) {
      body {
        grid-template-columns: 60px minmax(0, 1fr);
      }

      .inspector {
        width: min(var(--inspector-width), calc(100vw - 60px));
      }

      .terminal-panel {
        left: 60px;
      }

      body:not(.inspector-closed) .inspector {
        display: flex;
      }

      .tool-button {
        width: 42px;
        height: 42px;
      }

      .mark {
        width: 40px;
        height: 40px;
      }

      .interface-row {
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .interface-row input {
        grid-column: 1 / -1;
      }
    }

    /* ─── Simulation controls ─────────────────────────────── */

    .sim-controls {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 14px;
      gap: 8px;
      align-items: center;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }

    .sim-controls.active {
      display: flex;
    }

    .sim-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--surface);
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    .sim-btn:hover {
      background: var(--border);
    }

    .sim-speed-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
    }

    .sim-speed-label input[type="range"] {
      width: 80px;
      accent-color: var(--accent, #6366f1);
    }

    /* ─── Simulation terminal log colors ─────────────────── */

    .terminal-line.sim       { color: #a5b4fc; }
    .terminal-line.sim-arp   { color: #fbbf24; }
    .terminal-line.sim-icmp  { color: #34d399; }
    .terminal-line.sim-learn { color: #94a3b8; }
    .terminal-line.sim-forward { color: #7dd3fc; }
    .terminal-line.sim-drop  { color: #f87171; }
    .terminal-line.sim-dhcp  { color: #a78bfa; }

    /* ─── Simulation log panel ────────────────────────────── */

    .sim-log-panel {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      z-index: 9;
      width: 380px;
      max-height: calc(100vh - 120px);
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 10px 0 0 10px;
      background: #0a0f14;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sim-log-panel.active {
      display: flex;
    }

    body:not(.inspector-closed) .sim-log-panel {
      right: var(--inspector-width);
    }

    .sim-log-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 10px 0 14px;
      min-height: 36px;
      color: var(--text);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
    }

    .sim-log-titlebar span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sim-log-output {
      min-height: 60px;
      max-height: 400px;
      overflow: auto;
      padding: 10px 14px;
      color: #d6e3ef;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .sim-log-line {
      margin: 0 0 3px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sim-log-line.sim-arp     { color: #fbbf24; }
    .sim-log-line.sim-icmp    { color: #34d399; }
    .sim-log-line.sim-learn   { color: #94a3b8; }
    .sim-log-line.sim-forward { color: #7dd3fc; }
    .sim-log-line.sim-drop    { color: #f87171; }
    .sim-log-line.sim-dhcp    { color: #a78bfa; }

    @media (max-width: 820px) {
      .sim-log-panel {
        width: min(340px, calc(100vw - 80px));
      }
    }

    /* ─── Link frame history ──────────────────────────────── */

    .frame-history-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 320px;
      overflow: auto;
    }

    .frame-history-entry {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      font-size: 11px;
      font-weight: 600;
    }

    .frame-step {
      color: var(--muted);
      font-weight: 800;
      font-size: 10px;
    }

    .frame-label {
      font-weight: 700;
    }

    .frame-dir {
      color: var(--muted);
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .frame-history-entry.arp .frame-label  { color: #fbbf24; }
    .frame-history-entry.icmp .frame-label { color: #34d399; }
    .frame-history-entry.dhcp .frame-label { color: #a78bfa; }

    /* ─── Port selection modal ─── */

    .port-selection-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.5);
      place-items: center;
    }
    .port-selection-overlay.open {
      display: grid;
    }
    .port-selection-modal {
      width: min(640px, calc(100vw - 48px));
      max-height: calc(100vh - 80px);
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .port-selection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .port-selection-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
    }
    .port-selection-body {
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .port-selection-body.single-column {
      grid-template-columns: 1fr;
    }
    .port-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .port-column-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .port-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-bg);
      color: var(--fg);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .port-option:hover:not(.occupied) {
      border-color: var(--accent, #f0b429);
      background: rgba(240, 180, 41, 0.06);
    }
    .port-option.selected {
      border-color: var(--accent, #f0b429);
      background: rgba(240, 180, 41, 0.12);
    }
    .port-option.occupied {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .port-option .port-name {
      font-weight: 500;
    }
    .port-option .port-status {
      font-size: 11px;
      color: var(--muted);
    }
    .port-selection-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

  </style>
</head>

      --switch-stroke: #1f8f86;
      --switch-accent: #173a35;
      --switch-icon: #7fd1c8;
      --router-fill: #2b2114;
      --router-stroke: #a56a26;
      --router-accent: #3a2a16;
      --router-icon: #d6a15e;
      --lan-fill: #1e2431;
      --lan-stroke: #6f8192;
      --lan-accent: #293242;
      --lan-icon: #b7c4d1;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.34);
      --inspector-width: 320px;
      --terminal-height: 280px;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --theme: light;
      --bg: #eef1f4;
      --panel: #ffffff;
      --panel-soft: #f7f9fb;
      --line: #cfd7df;
      --line-strong: #8b98a5;
      --text: #17212b;
      --muted: #667381;
      --accent-soft: #dff4f0;
      --danger: #bc3b3b;
      --stage-bg: #e8edf1;
      --canvas-bg: #eef3f6;
      --grid-major: rgba(38, 55, 70, 0.08);
      --grid-minor: rgba(38, 55, 70, 0.04);
      --topbar-bg: rgba(255, 255, 255, 0.92);
      --hint-text: #41505f;
      --hint-bg: rgba(255, 255, 255, 0.88);
      --rail-bg: #1d2935;
      --rail-button-active-text: #0e5b57;
      --rail-button-active-bg: #d7f1ed;
      --link-host: #3f4650;
      --link-switch: #2563eb;
      --link-router: #dc2626;
      --link-active: #0e827a;
      --label-primary: #17212b;
      --label-ip: #52616f;
      --label-mac: #667381;
      --pc-fill: #f8fbff;
      --pc-stroke: #3264a8;
      --pc-accent: #dbeafe;
      --pc-icon: #244c84;
      --switch-fill: #f8fff9;
      --switch-stroke: #14746f;
      --switch-accent: #dff4f0;
      --switch-icon: #0d5a56;
      --router-fill: #fffaf1;
      --router-stroke: #9a5b13;
      --router-accent: #fdecc8;
      --router-icon: #73420c;
      --lan-fill: #f7f9fb;
      --lan-stroke: #667381;
      --lan-accent: #e8eef3;
      --lan-icon: #41505f;
      --shadow: 0 10px 28px rgba(19, 33, 46, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) var(--inspector-width);
      grid-template-rows: 100vh;
    }

    body.inspector-closed {
      grid-template-columns: 72px minmax(0, 1fr);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      background: var(--rail-bg);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #263746;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .tool-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-button,
    .icon-button {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      border-radius: 8px;
      transition: background 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .tool-button {
      width: 48px;
      height: 48px;
      color: #d7e1ea;
      background: transparent;
    }

    .tool-button svg,
    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .tool-button:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .tool-button.active {
      color: var(--rail-button-active-text);
      background: var(--rail-button-active-bg);
    }

    .spacer {
      flex: 1;
    }

    .stage {
      min-width: 0;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      background: var(--stage-bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--line);
    }

    .title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1;
      letter-spacing: 0;
    }

    .mode-label {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zoom-readout {
      min-width: 54px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .icon-button:hover {
      color: var(--text);
      background: var(--panel);
      transform: translateY(-1px);
    }

    .icon-button[aria-expanded="true"] {
      color: var(--accent);
      border-color: rgba(20, 116, 111, 0.35);
      background: var(--accent-soft);
    }

    .icon-button.danger:hover {
      color: var(--danger);
      border-color: rgba(188, 59, 59, 0.36);
    }

    .topology-chooser {
      position: relative;
      display: inline-block;
    }
    .topology-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      min-width: 200px;
      z-index: 100;
      padding: 4px 0;
    }
    .topology-menu.open { display: block; }
    .topology-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 14px;
      font: 600 13px/1 Inter, system-ui, sans-serif;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 0;
    }
    .topology-option:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: var(--canvas-bg);
      background-image:
        linear-gradient(var(--grid-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
        linear-gradient(var(--grid-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
      cursor: crosshair;
    }

    .hint {
      position: absolute;
      left: 16px;
      bottom: 16px;
      max-width: min(560px, calc(100% - 32px));
      padding: 9px 12px;
      border: 1px solid rgba(139, 152, 165, 0.32);
      border-radius: 8px;
      color: var(--hint-text);
      background: var(--hint-bg);
      box-shadow: 0 6px 18px rgba(19, 33, 46, 0.08);
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .terminal-panel {
      position: fixed;
      left: 72px;
      right: 0;
      bottom: 0;
      z-index: 8;
      height: min(var(--terminal-height), calc(100vh - 80px));
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr) 44px;
      border-top: 1px solid var(--line);
      background: #0a0f14;
      box-shadow: 0 -18px 36px rgba(0, 0, 0, 0.28);
    }

    body:not(.inspector-closed) .terminal-panel {
      right: var(--inspector-width);
    }

    body.terminal-closed .terminal-panel {
      display: none;
    }

    .terminal-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px 0 16px;
      color: var(--text);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
    }

    .terminal-titlebar span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .terminal-output {
      min-height: 0;
      overflow: auto;
      padding: 12px 16px;
      color: #d6e3ef;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .terminal-line {
      margin: 0 0 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .terminal-line.command {
      color: #7dd3fc;
    }

    .terminal-line.error {
      color: #fca5a5;
    }

    .terminal-line.muted {
      color: #95a4b3;
    }

    .terminal-input-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px 12px 10px 16px;
      border-top: 1px solid rgba(214, 224, 235, 0.12);
      color: #7dd3fc;
      background: #0a0f14;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .terminal-input-row input {
      width: 100%;
      min-width: 0;
      height: 26px;
      border: 0;
      outline: 0;
      color: #e6edf3;
      background: transparent;
      font: inherit;
    }

    .terminal-input-row input::placeholder {
      color: #6f8192;
    }

    .inspector {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .inspector-resize {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 3;
      width: 8px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: col-resize;
    }

    .inspector-resize::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: transparent;
      transition: background 140ms ease;
    }

    .inspector-resize:hover::before,
    body.resizing-inspector .inspector-resize::before {
      background: var(--accent);
    }

    body.resizing-inspector {
      cursor: col-resize;
      user-select: none;
    }

    body.inspector-closed .inspector {
      display: none;
    }

    .panel-section {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-section h2 {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-heading h2 {
      margin: 0;
    }

    .panel-toggle {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel-soft);
      cursor: pointer;
    }

    .panel-toggle:hover,
    .panel-toggle[aria-expanded="true"] {
      color: var(--text);
      background: var(--panel);
    }

    .panel-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .option-list {
      display: grid;
      gap: 10px;
    }

    .option-list.closed {
      display: none;
    }

    .toggle-row {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 13px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-width: 0;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 10px;
      color: var(--text);
      background: var(--panel-soft);
      outline: none;
    }

    .field input::placeholder {
      color: var(--muted);
      opacity: 0.78;
    }

    .input-with-button {
      display: flex;
      gap: 6px;
    }

    .input-with-button input {
      flex: 1;
    }

    .inline-button {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .inline-button:hover {
      color: var(--text);
      border-color: var(--line-strong);
      background: var(--panel);
    }

    .field input[type="checkbox"] {
      width: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--accent);
      justify-self: start;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      color: #29404f;
      background: #e8eef3;
      font-size: 12px;
      font-weight: 700;
    }

    .port-list {
      display: grid;
      gap: 6px;
      margin: 2px 0 13px;
    }

    .interface-list {
      display: grid;
      gap: 8px;
      margin: 2px 0 13px;
    }

    .interface-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 46px minmax(70px, 0.8fr) minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      font-size: 12px;
    }

    .interface-name {
      color: var(--muted);
      font-weight: 800;
    }

    .interface-peer {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
    }

    .interface-row input {
      width: 100%;
      min-width: 0;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 9px;
      color: var(--text);
      background: var(--panel);
      outline: none;
    }

    .port-row {
      min-width: 0;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      font-size: 12px;
    }

    .port-id {
      color: var(--muted);
      font-weight: 800;
      flex: 0 0 38px;
    }

    .port-mode {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--panel);
      color: var(--muted);
    }
    .port-mode.trunk {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .port-vlan {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
    }

    .port-peer {
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
    }

    .port-peer.empty {
      color: var(--muted);
      font-weight: 600;
    }

    .data-table {
      width: 100%;
      margin: 2px 0 13px;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel-soft);
      font-size: 12px;
    }

    .data-table th,
    .data-table td {
      min-width: 0;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    .data-table th {
      color: var(--muted);
      font-weight: 800;
      background: var(--panel);
    }

    .data-table tr:last-child td {
      border-bottom: 0;
    }

    .data-table td {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
    }

    .table-empty {
      color: var(--muted);
      font-weight: 600;
    }

    .port-remove {
      appearance: none;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      line-height: 1;
    }

    .port-remove:hover {
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.42);
      background: var(--panel);
    }

    .port-remove svg {
      display: block;
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .empty-state {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .wide-button {
      width: 100%;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--panel-soft);
      cursor: pointer;
    }

    .wide-button:hover {
      border-color: var(--line-strong);
      background: var(--panel);
    }

    .wide-button.danger {
      color: var(--danger);
    }

    .wide-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .device-list {
      padding: 10px;
    }

    .device-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .device-row:hover,
    .device-row.active {
      border-color: var(--line);
      background: var(--panel-soft);
    }

    .device-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .device-type {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      body,
      body.inspector-closed {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .inspector {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        width: min(var(--inspector-width), calc(100vw - 72px));
        height: 100vh;
        box-shadow: var(--shadow);
      }

      body:not(.inspector-closed) .inspector {
        display: flex;
      }

      body.inspector-closed .inspector {
        display: none;
      }

      .terminal-panel,
      body:not(.inspector-closed) .terminal-panel {
        right: 0;
      }
    }

    @media (max-width: 820px) {
      body {
        grid-template-columns: 60px minmax(0, 1fr);
      }

      .inspector {
        width: min(var(--inspector-width), calc(100vw - 60px));
      }

      .terminal-panel {
        left: 60px;
      }

      body:not(.inspector-closed) .inspector {
        display: flex;
      }

      .tool-button {
        width: 42px;
        height: 42px;
      }

      .mark {
        width: 40px;
        height: 40px;
      }

      .interface-row {
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .interface-row input {
        grid-column: 1 / -1;
      }
    }

    /* ─── Simulation controls ─────────────────────────────── */

    .sim-controls {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 14px;
      gap: 8px;
      align-items: center;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }

    .sim-controls.active {
      display: flex;
    }

    .sim-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--surface);
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    .sim-btn:hover {
      background: var(--border);
    }

    .sim-speed-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
    }

    .sim-speed-label input[type="range"] {
      width: 80px;
      accent-color: var(--accent, #6366f1);
    }

    /* ─── Simulation terminal log colors ─────────────────── */

    .terminal-line.sim       { color: #a5b4fc; }
    .terminal-line.sim-arp   { color: #fbbf24; }
    .terminal-line.sim-icmp  { color: #34d399; }
    .terminal-line.sim-learn { color: #94a3b8; }
    .terminal-line.sim-forward { color: #7dd3fc; }
    .terminal-line.sim-drop  { color: #f87171; }
    .terminal-line.sim-dhcp  { color: #a78bfa; }

    /* ─── Simulation log panel ────────────────────────────── */

    .sim-log-panel {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      z-index: 9;
      width: 380px;
      max-height: calc(100vh - 120px);
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 10px 0 0 10px;
      background: #0a0f14;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sim-log-panel.active {
      display: flex;
    }

    body:not(.inspector-closed) .sim-log-panel {
      right: var(--inspector-width);
    }

    .sim-log-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 10px 0 14px;
      min-height: 36px;
      color: var(--text);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
    }

    .sim-log-titlebar span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sim-log-output {
      min-height: 60px;
      max-height: 400px;
      overflow: auto;
      padding: 10px 14px;
      color: #d6e3ef;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .sim-log-line {
      margin: 0 0 3px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sim-log-line.sim-arp     { color: #fbbf24; }
    .sim-log-line.sim-icmp    { color: #34d399; }
    .sim-log-line.sim-learn   { color: #94a3b8; }
    .sim-log-line.sim-forward { color: #7dd3fc; }
    .sim-log-line.sim-drop    { color: #f87171; }
    .sim-log-line.sim-dhcp    { color: #a78bfa; }

    @media (max-width: 820px) {
      .sim-log-panel {
        width: min(340px, calc(100vw - 80px));
      }
    }

    /* ─── Link frame history ──────────────────────────────── */

    .frame-history-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 320px;
      overflow: auto;
    }

    .frame-history-entry {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      font-size: 11px;
      font-weight: 600;
    }

    .frame-step {
      color: var(--muted);
      font-weight: 800;
      font-size: 10px;
    }

    .frame-label {
      font-weight: 700;
    }

    .frame-dir {
      color: var(--muted);
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .frame-history-entry.arp .frame-label  { color: #fbbf24; }
    .frame-history-entry.icmp .frame-label { color: #34d399; }
    .frame-history-entry.dhcp .frame-label { color: #a78bfa; }

    /* ─── Port selection modal ─── */

    .port-selection-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.5);
      place-items: center;
    }
    .port-selection-overlay.open {
      display: grid;
    }
    .port-selection-modal {
      width: min(640px, calc(100vw - 48px));
      max-height: calc(100vh - 80px);
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .port-selection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .port-selection-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
    }
    .port-selection-body {
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .port-selection-body.single-column {
      grid-template-columns: 1fr;
    }
    .port-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .port-column-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .port-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-bg);
      color: var(--fg);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .port-option:hover:not(.occupied) {
      border-color: var(--accent, #f0b429);
      background: rgba(240, 180, 41, 0.06);
    }
    .port-option.selected {
      border-color: var(--accent, #f0b429);
      background: rgba(240, 180, 41, 0.12);
    }
    .port-option.occupied {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .port-option .port-name {
      font-weight: 500;
    }
    .port-option .port-status {
      font-size: 11px;
      color: var(--muted);
    }
    .port-selection-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

  </style>
</head>
